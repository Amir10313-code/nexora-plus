name: Android Build (APK + AAB)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXORA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/nexora-release.jks
            echo "KEYSTORE_READY=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_READY=false" >> $GITHUB_ENV
          fi

      - name: Build signed Release (APK + AAB)
        if: env.KEYSTORE_READY == 'true'
        env:
          NEXORA_KEYSTORE_PATH: ${{ github.workspace }}/keystore/nexora-release.jks
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.NEXORA_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.NEXORA_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Build Debug (fallback when no keystore)
        if: env.KEYSTORE_READY == 'false'
        run: |
          gradle assembleDebug bundleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-plus-apk
          path: |
            app/build/outputs/apk/**/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: nexora-plus-aab
          path: |
            app/build/outputs/bundle/**/*.aab

      # Push a tag like v2.5.1 and the signed APK + AAB land on the repo's
      # Releases page (direct download links, no Actions login needed).
      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
